version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: friday
    groups:
      codeql-actions:
        patterns:
          - "github/codeql-action/*"

  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: friday
    groups:
      dotnet-runtime:
        patterns:
          - "Microsoft.Extensions.Configuration.*"
          - "Microsoft.Win32.*"
    ignore:
      - dependency-name: "Microsoft.Extensions.Configuration.*"
        update-types:
          - version-update:semver-major
      - dependency-name: "Microsoft.Win32.*"
        update-types:
          - version-update:semver-major
